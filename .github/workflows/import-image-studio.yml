name: Import Image-Studio source

on:
  push:
    paths:
      - ".github/workflows/import-image-studio.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source
        shell: bash
        run: |
          set -euo pipefail
          test -f image-studio-import.tar.gz
          mkdir -p /tmp/image-studio-source
          tar -xzf image-studio-import.tar.gz -C /tmp/image-studio-source
          cp -a /tmp/image-studio-source/. .
          rm -f image-studio-import.tar.gz
          rm -f .github/workflows/import-image-studio.yml
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Image-Studio source"
          git push origin HEAD:main
