name: Verify prompt center
on:
  pull_request:
    paths:
      - 'image-studio/frontend/src/studio/**'
      - 'image-studio/frontend/test/studio-prompts.test.mjs'
      - 'image-studio/backend/studio/**'
      - 'image-studio/backend/studio_prompts.go'
      - 'image-studio/backend/studio_catalog.go'
      - 'scripts/verify-reference-catalog.py'
      - 'scripts/test-public-catalog.py'
      - 'image-studio/frontend/test/studio-catalog.test.mjs'
      - 'scripts/test-prompt-center.py'
      - '.github/workflows/verify-prompt-center.yml'
  push:
    branches: [main]
    paths:
      - 'image-studio/frontend/src/studio/**'
      - 'image-studio/backend/studio/**'
      - 'image-studio/backend/studio_prompts.go'
      - 'image-studio/backend/studio_catalog.go'
      - 'scripts/verify-reference-catalog.py'
      - 'scripts/test-public-catalog.py'
      - 'image-studio/frontend/test/studio-catalog.test.mjs'
      - 'scripts/test-prompt-center.py'
      - '.github/workflows/verify-prompt-center.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prompt-center-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            image-studio/go.sum
            go-cli/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Core persistence and mock API regression
        working-directory: image-studio
        run: go test -race -count=3 ./backend/studio/...
      - name: Frontend tests and production build
        working-directory: image-studio/frontend
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          npm ci
          npm test
          npm run build:windows
      - name: Compile the Wails host with prompt bindings
        working-directory: image-studio
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o /tmp/xai-prompt-center.exe .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser regression runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify real browser clipboard, library and canvas interactions
        run: python scripts/test-prompt-center.py
      - name: Capture exact reference sources and original previews (public data only)
        run: python scripts/verify-reference-catalog.py
      - name: Verify real source images, full prompt copying, saved pairing and cache fallback
        run: python scripts/test-public-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-center-evidence
          path: |
            image-studio/frontend/studio-evidence/prompt-center
            image-studio/frontend/studio-evidence/public-catalog
            image-studio/frontend/studio-evidence/reference-source/manifest.json
          if-no-files-found: warn
          retention-days: 7
