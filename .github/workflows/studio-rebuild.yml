name: Studio rebuild validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-rebuild-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source revision
        run: git archive --format=zip --output=studio-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source
          path: studio-source.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify maintained desktop architecture
        run: node scripts/verify-desktop-architecture.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.work.sum
            image-studio/go.sum
            go-cli/go.sum
      - name: Go formatting, vet and static analysis
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt is required for:"
            echo "$unformatted"
            exit 1
          fi
          (cd go-cli && go vet ./...)
          (cd image-studio && go vet ./backend/...)
          # Build the analyzer with the workspace toolchain so it can load it.
          GOTOOLCHAIN=go1.26.3 go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck="$(go env GOPATH)/bin/staticcheck"
          (cd go-cli && "$staticcheck" ./...)
          (cd image-studio && "$staticcheck" ./backend/studio/...)
      # Failing Go tests are also reported as annotations, which stay readable
      # through the checks API when the raw log is not at hand.
      - name: Test go-cli client
        working-directory: go-cli
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-cli.log"; then
            grep -E -- '--- FAIL|^panic:|_test\.go:[0-9]+:' "$RUNNER_TEMP/go-cli.log" | head -10 | sed 's/^[[:space:]]*/::error title=go-cli test::/'
            exit 1
          fi
      - name: Test studio domain with race detector
        if: ${{ !cancelled() }}
        working-directory: image-studio
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=3 -v ./backend/studio/... 2>&1 | tee "$RUNNER_TEMP/studio.log"; then
            grep -E -- '--- FAIL|^panic:|_test\.go:[0-9]+:' "$RUNNER_TEMP/studio.log" | head -10 | sed 's/^[[:space:]]*/::error title=Studio test::/'
            exit 1
          fi
      - name: Test desktop bindings
        if: ${{ !cancelled() }}
        working-directory: image-studio
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race -count=1 ./backend/ 2>&1 | tee "$RUNNER_TEMP/backend.log"; then
            grep -E -- '--- FAIL|^panic:|_test\.go:[0-9]+:' "$RUNNER_TEMP/backend.log" | head -10 | sed 's/^[[:space:]]*/::error title=Desktop binding test::/'
            exit 1
          fi
      - name: Install frontend
        if: always()
        working-directory: image-studio/frontend
        run: npm ci
      - name: Check Studio formatting
        if: always()
        working-directory: image-studio/frontend
        run: >-
          npx --yes prettier@3.8.1 --check src/studio src/lib/upstreamRegistry.ts
          test/studio-*.test.mjs test/upstreamRegistry.test.mjs test/fixtures/studio-*.tsx
      - name: Frontend unit tests
        if: always()
        working-directory: image-studio/frontend
        shell: bash
        run: |
          mkdir -p studio-evidence
          set -o pipefail
          npm test 2>&1 | tee studio-evidence/frontend-tests.log
      - name: Typecheck frontend
        if: always()
        working-directory: image-studio/frontend
        shell: bash
        run: |
          mkdir -p studio-evidence
          git rev-parse HEAD > studio-evidence/commit.txt
          cp src/studio/Canvas.tsx studio-evidence/Canvas.tsx.txt
          set -o pipefail
          npx tsc --noEmit --pretty false 2>&1 | tee studio-evidence/typecheck.log
      # A failing Go test must not hide the frontend and browser results.
      - name: Build frontend
        if: ${{ !cancelled() }}
        working-directory: image-studio/frontend
        run: npm run build
      - name: Check Windows desktop integration
        if: ${{ !cancelled() }}
        working-directory: image-studio
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o /tmp/image-studio-check.exe .
      - name: Verify maintained desktop dependencies
        if: ${{ !cancelled() }}
        working-directory: image-studio
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go list -deps . > frontend/studio-evidence/desktop-dependencies.txt
          if grep -Eq '^(gioui\.org(/|$)|image-studio/gio-client(/|$))' frontend/studio-evidence/desktop-dependencies.txt; then
            echo "::error::Retired desktop dependency found"
            exit 1
          fi
      - name: Install browser verification tools
        if: ${{ !cancelled() }}
        working-directory: image-studio/frontend
        run: |
          npm install --no-save --package-lock=false playwright@1.55.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser interactions and screenshots
        if: ${{ !cancelled() }}
        working-directory: image-studio/frontend
        run: node scripts/studio-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: image-studio/frontend/studio-evidence
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: studio-web-preview
          path: image-studio/frontend/dist
          retention-days: 7
  windows-core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.work.sum
            image-studio/go.sum
      - name: Test native Windows storage and core
        working-directory: image-studio
        run: go test -count=3 ./backend/studio/...
