name: Backend v2 development dependencies
on:
  push:
    branches: [codex/backend-v2-video-canvas]
    paths: ['.github/workflows/backend-v2-devtools.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: image-studio/frontend
      - run: tar -czf frontend-dependencies.tar.gz -C image-studio/frontend node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dependencies
          path: frontend-dependencies.tar.gz
          retention-days: 1
