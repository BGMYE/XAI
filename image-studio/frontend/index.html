<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Image Studio</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var android = /Android/i.test(navigator.userAgent) || /^android/.test(params.get("target") || params.get("platform") || "");
        var dark = android && matchMedia("(prefers-color-scheme: dark)").matches;
        if (android) {
          try { var preference = localStorage.getItem("gptcodex.theme"); if (preference === "light" || preference === "dark") dark = preference === "dark"; } catch (_) {}
        }
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "#1C1C1E" : "#F5F5F7";
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
